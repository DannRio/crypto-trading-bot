[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-trading-bot"
version = "0.2.0"
description = "Universal crypto trading decision and research engine"
requires-python = ">=3.12"

dependencies = [
    "ccxt",
    "numpy",
    "pandas",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
crypto-engine = "trading_bot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
