[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-trading-bot"
version = "0.19.0"
description = "Persistent paper trading, coin analysis, and historical validation"
requires-python = ">=3.12"

dependencies = [
    "ccxt",
    "numpy",
    "pandas",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]
dev = [
    "pytest",
    "httpx>=0.27",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.scripts]
crypto-bot = "trading_bot.entry:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"trading_bot.web" = ["index.html", "coin.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
