[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-trading-bot"
version = "0.11.0"
description = "Universal crypto trading decision and research engine"
requires-python = ">=3.12"

dependencies = [
    "ccxt",
    "numpy",
    "pandas",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]
dev = [
    "pytest",
    "httpx>=0.27",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.scripts]
crypto-engine = "trading_bot.cli:main"
crypto-research = "trading_bot.research.cli:main"
crypto-paper = "trading_bot.paper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"trading_bot.web" = ["index.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
