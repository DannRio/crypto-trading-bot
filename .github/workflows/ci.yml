name: CI

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest --junitxml=test-results.xml
      - name: Record tested revision
        if: always()
        run: |
          git rev-parse HEAD > tested-revision.txt
          git archive --format=tar.gz --output=tested-source.tar.gz HEAD
      - name: Retain reproducibility artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tested-source-and-results
          path: |
            tested-revision.txt
            tested-source.tar.gz
            test-results.xml
          retention-days: 7
