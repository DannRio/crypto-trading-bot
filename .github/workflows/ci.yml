name: CI

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Verify supported launcher
        run: |
          crypto-bot --help
          crypto-bot analyze --help
          crypto-bot research --help
          crypto-bot paper daemon --help
      - name: Test
        run: python -m pytest --junitxml=test-results.xml
      - name: Record tested revision
        if: always()
        run: |
          git rev-parse HEAD > tested-revision.txt
          git archive --format=tar.gz --output=tested-source.tar.gz HEAD
      - name: Retain reproducibility artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tested-source-and-results
          path: |
            tested-revision.txt
            tested-source.tar.gz
            test-results.xml
          retention-days: 7

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment configuration
        run: docker compose config --quiet
      - name: Build packaged application
        run: docker build --tag crypto-bot:ci .
      - name: Verify CLI and dashboard
        run: |
          docker run --rm crypto-bot:ci crypto-bot --help
          docker run --rm crypto-bot:ci crypto-bot paper daemon --help
          docker run --rm crypto-bot:ci crypto-bot research universe --help
          docker run --rm crypto-bot:ci crypto-bot analyze --help
          docker run --rm --network none --volume "$PWD/tests:/tests:ro" crypto-bot:ci python /tests/smoke_core_container.py
          docker run --detach --name crypto-dashboard --publish 127.0.0.1:8000:8000 crypto-bot:ci
          python - <<'PY'
          import json, time, urllib.request
          for attempt in range(30):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2) as response:
                      health = json.load(response)
                      assert health['live_execution'] is False
                      assert health['paper_execution'] is False
                  break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit('Dashboard did not become healthy')
          with urllib.request.urlopen('http://127.0.0.1:8000/api/profiles') as response:
              assert len(json.load(response)['profiles']) == 3
          with urllib.request.urlopen('http://127.0.0.1:8000/analyze') as response:
              assert 'Analyze' in response.read().decode()
          with urllib.request.urlopen('http://127.0.0.1:8000/api/bot/status') as response:
              state = json.load(response)
              assert state['runtime']['state'] == 'stopped'
              assert state['paper']['status'] == 'not_started'
          PY
      - name: Container logs
        if: always()
        run: docker logs crypto-dashboard || true

  windows-account:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Verify Windows account locking and lifecycle
        run: python -m pytest tests/test_paper_recovery.py tests/test_core_runtime.py tests/test_history_jobs.py tests/test_paper_health.py
      - name: Exercise persisted worker restart
        run: python tests/smoke_core_container.py

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser test runtime
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify dashboard interactions with synthetic API fixtures
        run: python tests/browser/dashboard_smoke.py
      - name: Verify coin analysis with synthetic API fixtures
        run: python tests/browser/coin_analysis_smoke.py
      - name: Preserve browser failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-failure
          path: |
            dashboard-smoke-failure.png
            coin-analysis-smoke-failure.png
          if-no-files-found: ignore
          retention-days: 7
