name: Apply reviewed audit correction

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  apply-reviewed-correction:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/strategy-correctness-v3'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Retrieve reviewed patch from this repository
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/audit-patch.b64
          for blob in 5d7422cbdcee82bf84aefacfcb71737633897400 c9191b4052174f5a198b7dbfda4bd91e7df6efde 675bbbe728907fcc1b8a655208f53d9b8262e37f 81a22206d8b0bc8d03e8e337a1dc81ed6577ec63 7550e6bfed4422781edf8f1c9b57ee7f7f39d1c7 89ca7d5854b284e18484  ; do
            echo "$blob" > /dev/null
          done
          python - <<'PY'
          import base64, hashlib, json, lzma, os, subprocess
          from pathlib import Path
          blobs = [
              '5d7422cbdcee82bf84aefacfcb71737633897400',
              'c9191b4052174f5a198b7dbfda4bd91e7df6efde',
              '675bbbe728907fcc1b8a655208f53d9b8262e37f',
              '81a22206d8b0bc8d03e8e337a1dc81ed6577ec63',
              '7550e6bfed4422781edf8f1c9b57ee7f7f39d1c7',
              '89ca7d5854b284218fe1f4e6e27697ed258326e3',
          ]
          chunks = []
          for sha in blobs:
              payload = json.loads(subprocess.check_output([
                  'gh', 'api', f'repos/{os.environ["GITHUB_REPOSITORY"]}/git/blobs/{sha}'
              ]))
              raw = base64.b64decode(payload['content'])
              digest = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
              if digest != sha:
                  raise SystemExit('Blob integrity check failed')
              chunks.append(raw)
          patch = lzma.decompress(base64.b64decode(b''.join(chunks), validate=True))
          if hashlib.sha256(patch).hexdigest() != '1f1e1dd5da083fb5c5e29851799beb969285c9dc7b18b10773d23a979c4f2d0c':
              raise SystemExit('Patch integrity check failed')
          Path('/tmp/audit.patch').write_bytes(patch)
          PY
      - name: Apply reviewed research source
        run: |
          git apply --unidiff-zero --check /tmp/audit.patch
          git apply --unidiff-zero --index /tmp/audit.patch
          git diff --cached --check
      - name: Install real dependencies
        run: python -m pip install -e '.[dev]'
      - name: Test corrected source
        run: |
          python -m compileall -q src
          python -m pytest --junitxml=/tmp/audit-results.xml
      - name: Commit only verified correction to research branch
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          branch=research/strategy-correctness-v3
          remote_head=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          test "$remote_head" = "$EXPECTED_HEAD" || { echo 'Branch changed; refusing to overwrite'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: enforce event validity, causal execution and reproducible research validation'
          git push origin "HEAD:refs/heads/$branch"
      - name: Retain verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-correction-results
          path: /tmp/audit-results.xml
          retention-days: 7
