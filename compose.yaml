services:
  dashboard:
    build: .
    init: true
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - bot-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

  paper:
    build: .
    profiles: ["paper"]
    init: true
    command:
      - crypto-paper
      - daemon
      - --profile
      - liquid-spot
      - --exchange
      - "${TRADING_EXCHANGE:-kraken}"
      - --quote-currencies
      - "${TRADING_QUOTE_CURRENCIES:-USD}"
      - --journal
      - data/paper/continuous_paper.db
    volumes:
      - bot-data:/app/data
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-m", "trading_bot.paper.health", "--max-age-seconds", "1800"]
      interval: 60s
      timeout: 15s
      start_period: 5m
      retries: 3

volumes:
  bot-data:
