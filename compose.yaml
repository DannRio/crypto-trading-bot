services:
  dashboard:
    build: .
    init: true
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - bot-data:/app/data
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  bot-data:
